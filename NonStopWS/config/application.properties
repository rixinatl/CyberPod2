server.address=10.49.139.7
server.port = 8443

spring.main.lazy-initialization=true
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

spring.mail.host=smtp.mckesson.com
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

config.file.nonstop=config/nonstop.properties
config.file.accessctrl=config/accessctrl.properties
config.file.db=config/db.properties

nonstop.status.request=016  000000%TransCode%TT000011000000BS45        0000000000000000000000000000

lh.status.running=Running
lh.status.notrunning=Not Running
lh.status.waitHostId=Wait Host ID
lh.status.fecomAborted=FECOM Aborted

transaction.ce1.preftech.enabled=false

ppe.bypass.detector.enabled=false
ppe.bypass.detector.check_interval=10
ppe.bypass.detector.from_email=RHP-VanSupport@McKesson.com
ppe.bypass.detector.to_email=rixin.ge@relayhealth.com
ppe.bypass.detector.subject=PPE Bypass Detected

LogPurger.Enabled=true
LogPurger.LogDir=/opt/relayhealth/van/NonStopWS/logs
LogPurger.CheckInterval=60
LogPurger.LogRetention=7

#Site name, NonStop system name, Status IP and port
siteinfo.site1=DC21,FE6,10.49.139.7:9013,08
siteinfo.site3=DA11,FE9,10.108.7.65:9013,0D

fecom.command.hostIdDown=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;DO HOSTID DOWN;EXIT"
fecom.command.hostIdUp=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;DO HOSTID UP;EXIT"
fecom.command.startAll=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;START ALL;EXIT"
fecom.command.getStatus=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;PIDS;EXIT"
fecom.command.getIpInfo=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;DO IPINFO;EXIT"
fecom.command.sall=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;S ALL;EXIT"
fecom.command.status=/bin/gtacl -c "FECOM \\%SysName%.%ProcName%;STATUS;EXIT"
